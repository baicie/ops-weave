openapi: 3.1.0
info:
  title: OpsWeave platform API
  version: 0.1.0-draft
  description: >
    Identity-scoped business endpoints. Tenant and permissions are taken from the
    trusted principal, never from query or body. OIDC is not implemented.
    Zabbix Host ingest is available only when an explicit source mode is configured.
paths:
  /api/v1/entities:
    get:
      operationId: listEntities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entities visible to the trusted principal in its tenant
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/entities/{entityId}:
    get:
      operationId: getEntity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized Entity
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/entity.schema.json
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found in the principal tenant
  /api/v1/integrations/zabbix/hosts/sync:
    post:
      operationId: syncZabbixHosts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Host page ingested through the published PipelineDefinition
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '503':
          description: Source is closed or the live fetch failed; inventory is not reconciled
  /api/v1/integrations/zabbix/items/{itemId}/history:
    get:
      operationId: readZabbixNumericHistory
      description: >
        Read one active binding in the configured source, authorized by source.sync,
        metric.read and entity.read including source, metric and entity scope.
        At most 3600 inclusive seconds in the past and 500 returned points.
        afterClock and afterNs must appear together and refer to this same item/window.
        Values are normalized decimal strings, with nanosecond timestamps.
        nextCursor is an exclusive read position, never a durable ingestion checkpoint.
        windowComplete covers this scan attempt only, not late-arriving data.
        No points are stored. No implicit retry or fallback to fixture.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - in: query
          name: from
          required: true
          schema: {type: integer, minimum: 0, maximum: 9999999999}
        - in: query
          name: till
          required: true
          schema: {type: integer, minimum: 0, maximum: 9999999999}
        - in: query
          name: afterClock
          schema: {type: integer, minimum: 0, maximum: 9999999999}
        - in: query
          name: afterNs
          schema: {type: integer, minimum: 0, maximum: 999999999}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Authorized source page, explicitly not persisted
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/metric-history-page.schema.json
        '400':
          description: Invalid window/cursor/limit or attempted identity override
        '401':
          description: Unauthenticated
        '403':
          description: Missing permission or source scope
        '404':
          description: Binding absent, inactive or outside the authorized entity/metric scope
        '503':
          description: Source closed/failed, metadata changed, unsupported type, bad response, dense second or concurrency limit; no points or cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    enum: [SOURCE_UNAVAILABLE, SOURCE_FETCH_FAILED, INVALID_SOURCE_RESPONSE, UNSUPPORTED_HISTORY, METADATA_CHANGED, HISTORY_SECOND_LIMIT, HISTORY_BUSY]
  /api/v1/incidents/{incidentId}:
    get:
      operationId: getIncident
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized Incident
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/incident.schema.json
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/entities/{entityId}/metrics/{metricKey}/series:
    get:
      operationId: queryMetricSeries
      description: >
        Read stored samples for one entity and catalog metric. Authorization is
        entity.read and metric.read only; source.sync is not required.
        The caller cannot submit PromQL or MetricsQL. The window is at most 3600
        seconds and at most 500 points. Distinct sources stay in separate series.
        NO_DATA is an empty successful read. Storage failure is 503, not an empty array.
        partial means the scan budget was exceeded; fresh then describes only the returned points.
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: entityId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: metricKey, required: true, schema: {type: string}}
        - {in: query, name: from, required: true, schema: {type: integer}}
        - {in: query, name: till, required: true, schema: {type: integer}}
        - {in: query, name: maxPoints, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 500}}
      responses:
        '200':
          description: Series page with an explicit status kind
        '400':
          description: Invalid window, metric key, or point budget
        '401':
          description: Unauthenticated
        '403':
          description: Missing entity.read or metric.read for this object
        '404':
          description: Entity or metric definition is absent in the principal tenant
        '503':
          description: Time-series store is closed or the response was rejected
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
