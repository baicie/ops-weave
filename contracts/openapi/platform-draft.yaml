openapi: 3.1.0
info:
  title: AIOps planned business API
  version: 0.1.0-draft
  description: Contract draft only. These business endpoints are NOT implemented by the starter.
paths:
  /api/v1/incidents/{incidentId}:
    get:
      operationId: getIncident
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized Incident
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/incident.schema.json
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
