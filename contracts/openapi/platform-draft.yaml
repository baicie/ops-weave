        '200':
          description: Immutable actor-bound configuration receipt
          content:
            application/json:
              schema: {$ref: '../schemas/v2/workflow-quality-alert-receipt.schema.json'}
        '400': {description: Invalid closed JSON, path/body mismatch, duplicate keys or trailing content}
        '403': {description: Missing workflow authority}
        '409': {description: Stale configuration version, digest or reused request conflict}
