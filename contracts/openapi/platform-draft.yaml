      - {$ref: '#/components/parameters/clientRequestId'}
      - {name: source, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'}}
      - {name: item, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}}
    get:
      operationId: readMetricBinding
      description: Read one owner-scoped metric binding and compatible mapping candidates without reading the upstream source.
      security: [{bearerAuth: []}, {browserSession: []}]
      responses:
        '200':
          description: Metric binding view
          content:
            application/json:
              schema: {$ref: '../schemas/v2/metric-mapping-read.schema.json'}
        default: {description: 400 invalid source or item; 401 unauthenticated; 403 denied; 404 hidden binding; 503 unavailable}
  /api/v2/metric-bindings/{source}/{item}/mapping:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
      - {name: source, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'}}
      - {name: item, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}}
    post:
      operationId: configureMetricBinding
      description: Persist one actor-bound compare-and-set mapping pin. The server rechecks source scope, mapping compatibility, binding version and request id; it never accepts tenant, entity ownership, source address or secret overrides.
      security: [{bearerAuth: []}, {browserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/v2/metric-mapping-command.schema.json'}
      responses:
        '200':
          description: Original metric mapping maintenance receipt
          content:
            application/json:
              schema: {$ref: '../schemas/v2/metric-mapping-receipt-read.schema.json'}
        default: {description: 400 invalid closed JSON; 403 denied; 409 stale binding or reused request; 503 unavailable}
  /api/v2/metric-bindings/{source}/{item}/mapping/commands/{requestId}:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
      - {name: source, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'}}
      - {name: item, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}}
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getMetricBindingReceipt
      description: Read the original owner-bound metric mapping receipt after an uncertain write; it never repeats the update.
      security: [{bearerAuth: []}, {browserSession: []}]
      responses:
        '200':
          description: Original metric mapping receipt
          content:
            application/json:
              schema: {$ref: '../schemas/v2/metric-mapping-receipt-read.schema.json'}
        '404': {description: Missing or hidden receipt}
        default: {description: 400 invalid path; 401 unauthenticated; 403 denied; 503 unavailable}
components:
  parameters:
    clientRequestId:
      in: header
      name: X-OpsWeave-Request-Id
      required: false
      description: Optional single UUID; malformed or duplicate values return 400. Server generates one if absent and echoes a canonical UUID on every API response. Never grants permissions or suppresses duplicate writes.
      schema: {type: string, format: uuid}
      example: 6c8d4385-c206-4b59-8c2e-f9d34f8b3500
    readSession:
      in: header
      name: X-OpsWeave-Read-Session
      required: true
      schema: {type: string, format: uuid}
  responses:
    reorganizationResult:
      description: Persisted actor-bound receipt; retries with the same request and actor return this original result
      content:
        application/json:
          schema: {$ref: ../schemas/v1/incident-reorganization-result.schema.json}
    reorganizationFailure:
      description: >
        400 invalid body/query; 401 unauthenticated; 403 permission denied; 404 missing or hidden Incident/receipt;
        409 changed versions/ownership, conflicting request key or unsupported state; 503 store/budget failure.
        An uncertain submission must be resolved by requestKey before starting a different adjustment.
    aiInsight:
      description: Persisted result with trusted identity, pinned Skill/model, explicit source modes, missing data and evidence references; reference integrity does not establish causation.
      content:
        application/json:
          schema: {$ref: ../schemas/v1/ai-insight-result.schema.json}
    toolResult:
      description: Bounded evidence result persisted atomically with execution audit; always preserves incomplete context warnings
      content:
        application/json:
          schema: {$ref: ../schemas/v1/tool-result.schema.json}
    modelSpend:
      description: Server-owned configured price estimate and explicit provider or mock usage; never a provider invoice
      content:
        application/json:
          schema: {$ref: ../schemas/v1/model-spend-result.schema.json}
    modelSpendMetrics:
      description: Tenant-scoped model call aggregates for a bounded time window
      content:
        application/json:
          schema: {$ref: ../schemas/v1/model-spend-metrics-result.schema.json}
    toolFailure:
      description: >
        400 invalid request; 401 unauthenticated; 403 denied; 404 absent/hidden session or evidence;
        409 pinned input changed; 410 expired; 429 shared budget or capacity exhausted;
        503 store/read budget failure; 504 fifteen-second executor deadline. No fallback to fixture or empty success.
  securitySchemes:
    historyService:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dedicated OAuth client_credentials access token profile described in ../history-service-identity.md. Never accepted as a browser or Runtime credential.
    runtimeKey:
      type: apiKey
      in: header
      name: X-OpsWeave-Runtime-Key
      description: Explicit local process attestation only; does not grant user permissions and is never exposed to Web/model.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Explicit loopback dev credential, or short-lived server-only Runtime delegation on allowlisted endpoints. Raw provider bearer JWTs are not accepted.
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-opsweave
      description: OIDC BFF HttpOnly Secure SameSite=Lax host cookie. Explicit loopback protocol tests use opsweave-test-session. Unsafe methods also require X-CSRF-TOKEN and the configured Origin.
