      responses:
        '200':
          description: Snapshot with explicit source modes, missing data, capture time and local source reference
          content:
            application/json:
              schema: {$ref: ../schemas/v1/platform-evidence.schema.json}
        default: {$ref: '#/components/responses/toolFailure'}
  /api/v1/ai/diagnoses:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
    post:
      operationId: diagnoseCurrentIncident
      description: >
        Loopback development BFF. Forwards the authenticated caller to a fixed Rust Runtime origin,
        one model call with four bounded evidence reads/rechecks. Java returns its freshly authorized
        saved result. Client supplies a stable runId; no automatic model retry. Current knowledge only.
      security: [{bearerAuth: []}, {browserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../schemas/v1/current-diagnose-request.schema.json}
      responses:
        '200': {$ref: '#/components/responses/aiInsight'}
        default:
          description: 400 invalid input; 401/403 authentication/authorization; 404 missing; 409 changed input; 410 expired; 429 busy; 503 unavailable; 504 bounded dispatch deadline. Lookup runId after uncertain outcome.
  /api/v1/ai/model-calls/reservations:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
    post:
      operationId: reserveModelSpend
      description: >
        Runtime-only admission after two native reads. Trusted actor, bound session and current resource permissions are checked.
        PostgreSQL serializes tenant-wide configured USD estimates; provider/model/rates and limits are server-owned.
        A run ID receives one permit only. Duplicate reservation is 409, including a retry after an unknown response.
        Unknown charges remain reserved across UTC days and process restarts. No automatic refund or model retry.
      security: [{bearerAuth: [], runtimeKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../schemas/v1/model-spend-reserve.schema.json}
      responses:
        '200': {$ref: '#/components/responses/modelSpend'}
        default: {$ref: '#/components/responses/toolFailure'}
  /api/v1/ai/model-calls/reports:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
    post:
      operationId: reportModelUsage
      description: >
        Runtime attests SDK-reported usage before output parsing/rechecks/result saving. Actor/session/run must match.
        The first report fixes usage, report time and the original rate snapshot; an identical report returns the original receipt.
        Cached input is conservatively priced at the full input rate. Estimates are not provider invoices.
        OIDC delegation permits one report after its one reservation, within its unchanged 65-second lifetime.
      security: [{bearerAuth: [], runtimeKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../schemas/v1/model-spend-report.schema.json}
      responses:
        '200': {$ref: '#/components/responses/modelSpend'}
        default: {$ref: '#/components/responses/toolFailure'}
  /api/v1/ai/model-calls/{runId}:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
      - {in: path, name: runId, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: readModelSpend
      description: >
        Owner-only read with fresh Incident and linked resource authorization. Does not call a model.
        A usage receipt does not prove successful diagnosis. Missing receipt never proves zero cost.
        RESERVED or UNCERTAIN has null usage/estimatedMicros and continues to account its full reserved amount.
      security: [{bearerAuth: []}, {browserSession: []}]
      responses:
        '200': {$ref: '#/components/responses/modelSpend'}
        default: {$ref: '#/components/responses/toolFailure'}
  /api/v1/ai/model-calls/metrics:
    parameters:
      - {$ref: '#/components/parameters/clientRequestId'}
      - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: model, required: false, schema: {type: string, pattern: '^[a-zA-Z0-9._:-]{1,128}$'}}
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
    get:
      operationId: readModelSpendMetrics
      description: >
        Read-only aggregate for the authenticated tenant. The server derives tenant identity from the trusted
        authentication boundary; query values cannot select a tenant. The window is half-open and bounded to 366 days.
        Results contain provider/model counts, token totals and configured-price estimates, never run, session, incident
        or subject identifiers. RESERVED and UNCERTAIN calls remain accounted at their reservation amount.
      security: [{bearerAuth: []}, {browserSession: []}]
      responses:
        '200': {$ref: '#/components/responses/modelSpendMetrics'}
        default: {$ref: '#/components/responses/toolFailure'}
  /api/v1/ai/insights:
