openapi: 3.1.0
info:
  title: OpsWeave Rust local diagnosis API
  version: 0.1.0
  description: Local synthetic demo only. No durable task, production identity, action
    or real platform API.
servers:
- url: http://127.0.0.1:8090
paths:
  /healthz:
    get:
      summary: Process health only
      responses:
        '200':
          description: Process alive
  /readyz:
    get:
      summary: Closed/demo mode readiness, not production readiness
      responses:
        '200':
          description: Demo-only readiness
        '503':
          description: Business mode closed
  /api/v1/diagnoses:
    post:
      summary: Synchronous synthetic read-only diagnosis
      security:
      - DevBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnoseRequest'
      responses:
        '200':
          description: RunResult with synthetic-fixture marker, ContextPack and InsightDraft
        '400':
          description: Invalid business time range or budget
        '401':
          description: Missing/invalid local developer token
        '403':
          description: Resource or evidence scope forbidden
        '413':
          description: Body exceeds 16 KiB
        '422':
          description: Malformed/unknown JSON fields
        '429':
          description: Local concurrency limit
        '502':
          description: Provider or model output validation failure
        '503':
          description: Runtime closed
        '504':
          description: Total diagnosis deadline exceeded
components:
  securitySchemes:
    DevBearer:
      type: http
      scheme: bearer
      description: Local generated developer token; NOT production OIDC
  schemas:
    DiagnoseRequest:
      title: DiagnoseRequest
      type: object
      additionalProperties: false
      properties:
        incidentId:
          type: string
          minLength: 1
          maxLength: 128
        question:
          type: string
          minLength: 1
          maxLength: 2000
        timeRange:
          type: object
          additionalProperties: false
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
          required:
          - from
          - to
        asOf:
          type: string
          format: date-time
      required:
      - incidentId
      - question
      - timeRange
      - asOf
    InsightDraft:
      title: InsightDraft v1
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 4000
        findings:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                enum:
                - observation
                - hypothesis
              statement:
                type: string
                minLength: 1
                maxLength: 2000
              evidenceRefs:
                type: array
                minItems: 1
                maxItems: 16
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
            required:
            - kind
            - statement
            - evidenceRefs
        missingData:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 500
        limitations:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 1000
      required:
      - summary
      - findings
      - missingData
      - limitations
