schemaVersion: '1.0'
id: zabbix-cpu-user
version: 1.0.0
status: draft
source:
  connector: zabbix
  itemKeyExact: system.cpu.util[,user]
target:
  metric: host.cpu.usage.user
  displayName: Host CPU usage (user)
  kind: gauge
  unit: '1'
  valueType: double
  dimensionSchema:
    - mode
  dimensions:
    mode: user
transform:
  operation: multiply
  factor: 0.01
validation:
  min: 0
  max: 1
# Only maps this exact key; do not treat all CPU modes as total utilization.
