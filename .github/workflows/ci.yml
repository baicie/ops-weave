name: opsweave-template
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_repo.py && python scripts/check_java_domain.py && python -m pytest tests/contracts
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Require bootstrap lockfile
        run: test -f Cargo.lock || (echo 'Generate, review and commit Cargo.lock using cargo generate-lockfile'; exit 1)
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.18', cache: 'pnpm'}
      - run: test -f pnpm-lock.yaml || (echo 'Generate, review and commit pnpm-lock.yaml'; exit 1)
      - run: pnpm install --frozen-lockfile && pnpm typecheck:web && pnpm build:web
      - run: pnpm --filter @opsweave/web-console exec playwright install chromium --with-deps
      - run: pnpm test:web
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: test -f gradlew || (echo 'Generate and commit the Gradle wrapper first'; exit 1)
      - run: chmod +x gradlew && ./gradlew :apps:platform-api:test :apps:platform-api:bootJar :apps:ingestion-worker:bootJar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: opsweave_dev
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsweave_dev -d opsweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPSWEAVE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/opsweave
      OPSWEAVE_TEST_JDBC_USER: opsweave_dev
      OPSWEAVE_TEST_JDBC_PASSWORD: ci-only-not-a-secret
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, rust, web, java]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: opsweave-remote-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime images
        run: |
          tag="${GITHUB_SHA}"
          docker build -f deploy/docker/java.Dockerfile --build-arg APP_NAME=platform-api -t "opsweave-platform-api:${tag}" .
          docker build -f deploy/docker/java.Dockerfile --build-arg APP_NAME=ingestion-worker -t "opsweave-ingestion-worker:${tag}" .
          docker build -f deploy/docker/agent.Dockerfile -t "opsweave-agent-runtime:${tag}" .
          docker build -f deploy/docker/web.Dockerfile -t "opsweave-web-console:${tag}" .
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy on the selected host
        env:
          SSHPASS: ${{ secrets.OPSWEAVE_DEPLOY_SSH_PASSWORD }}
          OPSWEAVE_DEPLOY_HOST: ${{ vars.OPSWEAVE_DEPLOY_HOST }}
          OPSWEAVE_DEPLOY_PORT: ${{ vars.OPSWEAVE_DEPLOY_PORT }}
          OPSWEAVE_DEPLOY_USER: ${{ vars.OPSWEAVE_DEPLOY_USER }}
          OPSWEAVE_DEPLOY_PATH: ${{ vars.OPSWEAVE_DEPLOY_PATH }}
          OPSWEAVE_DEPLOY_SSH_HOSTKEY: ${{ vars.OPSWEAVE_DEPLOY_SSH_HOSTKEY }}
          OPSWEAVE_DEPLOY_POSTGRES_PASSWORD: ${{ secrets.OPSWEAVE_DEPLOY_POSTGRES_PASSWORD }}
          OPSWEAVE_IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/deploy_over_ssh.sh
# First CI deliberately fails when real lockfiles/wrapper are missing; it never fabricates them.
# Pin actions to reviewed commit SHAs and add dependency verification before production use.
